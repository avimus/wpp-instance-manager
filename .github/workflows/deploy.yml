name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - name: Install Next.js deps
        run: npm ci
        working-directory: src

      - name: Type check
        run: npx tsc --noEmit
        working-directory: src

      - name: Lint
        run: npm run lint
        working-directory: src

      - name: Install WPP Service deps
        run: npm ci
        working-directory: wpp-service

      - name: Type check WPP Service
        run: npx tsc --noEmit
        working-directory: wpp-service

  deploy-vercel:
    name: Deploy to Vercel
    needs: lint-typecheck
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: src
      - name: Deploy
        run: npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: src
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-cloud-run:
    name: Deploy WPP Service to Cloud Run
    needs: lint-typecheck
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build & Push
        run: |
          gcloud builds submit wpp-service \
            --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/wpp-service
      - name: Deploy
        run: |
          gcloud run deploy wpp-service \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/wpp-service \
            --region southamerica-east1 \
            --min-instances 1 \
            --memory 1Gi \
            --platform managed \
            --allow-unauthenticated=false
